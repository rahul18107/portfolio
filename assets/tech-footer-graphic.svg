<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <!-- Blueprint Grid lines in footer background -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#345AAA" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#345AAA" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Tech Terminal Assistant Silhouette -->
  <g transform="translate(230, 25)" opacity="0.85">
    <!-- Monitor Head -->
    <rect x="20" y="15" width="100" height="75" rx="8" fill="#FFFFFF" stroke="#345AAA" stroke-width="2.5"/>
    <rect x="28" y="23" width="84" height="59" rx="4" fill="#E6F3FF" stroke="#345AAA" stroke-width="1.5"/>
    
    <!-- Eyes / Terminal Display -->
    <rect x="42" y="44" width="16" height="12" rx="3" fill="#345AAA"/>
    <rect x="82" y="44" width="16" height="12" rx="3" fill="#345AAA"/>
    <!-- Cute Blinking Pupils -->
    <circle cx="50" cy="50" r="3" fill="#10B981"/>
    <circle cx="90" cy="50" r="3" fill="#10B981"/>
    <!-- Smile -->
    <path d="M58,64 Q70,72 82,64" fill="none" stroke="#345AAA" stroke-width="2" stroke-linecap="round"/>

    <!-- Antenna -->
    <line x1="70" y1="15" x2="70" y2="0" stroke="#345AAA" stroke-width="2.5"/>
    <circle cx="70" cy="0" r="4" fill="#EF4444"/>

    <!-- Body Chassis -->
    <rect x="35" y="95" width="70" height="55" rx="6" fill="#FFFFFF" stroke="#345AAA" stroke-width="2.5"/>
    <!-- Chest Heart / CPU icon -->
    <rect x="52" y="108" width="36" height="28" rx="3" fill="#E6F3FF" stroke="#345AAA" stroke-width="1.5"/>
    <path d="M60,122 L65,116 L70,128 L75,120 L80,122" fill="none" stroke="#345AAA" stroke-width="2" stroke-linecap="round"/>

    <!-- Arms -->
    <path d="M35,110 Q15,115 18,135" fill="none" stroke="#345AAA" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="138" r="4.5" fill="#345AAA"/>
    <path d="M105,110 Q125,115 122,135" fill="none" stroke="#345AAA" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="122" cy="138" r="4.5" fill="#345AAA"/>

    <!-- Base / Wheels -->
    <ellipse cx="70" cy="158" rx="30" ry="8" fill="#E6F3FF" stroke="#345AAA" stroke-width="2"/>
    <circle cx="55" cy="162" r="5" fill="#345AAA"/>
    <circle cx="85" cy="162" r="5" fill="#345AAA"/>

    <text x="70" y="185" font-family="'Cousine', monospace" font-size="9" fill="#345AAA" font-weight="700" text-anchor="middle" letter-spacing="1">RAHUL_BOT // READY</text>
  </g>
</svg>
